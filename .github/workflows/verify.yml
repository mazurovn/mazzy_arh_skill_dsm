name: Verify DSM Studio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/core.cjs tests/workbench.cjs tests/enterprise_delivery.cjs tests/procurement.cjs
      - name: Install twice in a clean local workspace
        run: |
          node install-local.cjs --workspace "$RUNNER_TEMP/DSM workspace"
          node install-local.cjs --workspace "$RUNNER_TEMP/DSM workspace"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright nbformat nbclient openpyxl "ipykernel>=6,<8" "notebook>=7.5,<7.6" "jupyterlab>=4.5,<4.6" "mcp>=1,<2"
      - run: python -m playwright install --with-deps chromium
      - run: python tests/mcp_client.py
      - run: python tests/browser_notebook.py
      - run: python tests/workbench_browser.py
      - run: python tests/delivery_browser.py
      - run: python tests/procurement_browser.py
      - run: npm install -g @fission-ai/openspec@2.1.1
      - run: openspec validate --all --strict
      - run: python tests/openspec_roundtrip.py
